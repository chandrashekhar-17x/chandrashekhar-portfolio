# Weekly dependency update PRs. Minor/patch updates are grouped to reduce noise;
# major updates arrive as separate PRs so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: monthly }
