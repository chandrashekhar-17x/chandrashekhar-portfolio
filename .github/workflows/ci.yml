# CI: lint, type-check, test and build on every PR and every push to develop/main.
# Jobs only run for the parts of the repo that changed; `ci-ok` is the single
# status check to mark as "required" in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - 'Makefile'
            web:
              - *shared
              - 'apps/web/**'
              - 'content/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.nvmrc'
            python:
              - *shared
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'apps/mcp/**'
              - 'scripts/**'
              - 'content/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      # Internal office-project names must never be published (hashed list, stdlib only).
      - name: Confidentiality check (source)
        run: python3 scripts/check_confidential.py

  web:
    name: Web (lint · types · test · build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-web
      - run: pnpm --filter @portfolio/web typecheck
      - run: make test-web
      - run: make build
      - name: Confidentiality check (built site)
        run: make confidential-check
      - run: make smoke-web
      - name: Install Playwright browser
        run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: make e2e-web
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  visual:
    name: Web screenshots (Playwright container)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Same image as `make visual` locally, so screenshots render identically.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portfolio/web build
      - run: pnpm --filter @portfolio/web visual
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: apps/web/test-results-visual
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: make build
      - run: make lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          retention-days: 7

  python:
    name: Python (lint · types · test · content)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only (no moving "v10"); Dependabot keeps it current.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint-py
      - run: uv run mypy apps/api apps/worker apps/mcp scripts
      - run: make content-check
      - run: make test-py

  ci-ok:
    name: CI OK
    if: always()
    needs: [secrets, web, visual, lighthouse, python]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled (skipped is fine)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed."
