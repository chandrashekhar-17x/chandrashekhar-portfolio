[project]
name = "portfolio-api"
version = "0.1.0"
description = "FastAPI backend: content REST API, SSE chat, admin."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162.2",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
