<div class="label" aria-hidden="true">
  <span class="spin"></span>
  <span>loading · {{ label() }}</span>
  <span class="progress"><i></i></span>
</div>

<div class="skb head-eyebrow"></div>
<div class="skb head-title"></div>

@switch (kind()) {
  @case ('featured') {
    <div class="skb block featured"></div>
    <div class="skb featured-journey"></div>
  }
  @case ('graph') {
    <div class="skb block graph"></div>
  }
  @case ('work') {
    <div class="grid cards">
      @for (i of items(); track i) {
        <div class="skb block card"></div>
      }
    </div>
  }
  @case ('lab') {
    <div class="grid cards">
      @for (i of items(); track i) {
        <div class="skb block hud"></div>
      }
    </div>
  }
  @case ('xp') {
    <!-- Same layout as the real section: company blocks + education beside them. -->
    <div class="xp-layout">
      <div class="rows">
        <div class="skb block company-1"></div>
        <div class="skb block company-2"></div>
      </div>
      <div class="skb block edu"></div>
    </div>
  }
  @case ('contact') {
    <div class="grid two">
      <div class="skb block form"></div>
      <div class="skb block aside"></div>
    </div>
  }
}
