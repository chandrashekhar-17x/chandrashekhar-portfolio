<!-- Idle OR 1.5 s, whichever first: busy devices with running canvases may rarely be idle. -->
@defer (on idle; on timer(1500ms)) {
  <app-chat-widget />
  <app-command-palette />
  <!-- Arrow cursor: mouse users with motion allowed only (never touch / reduced motion). -->
  @if (prefs.richMotion) {
    <app-cursor />
  }
}
