<svg
  viewBox="0 0 300 150"
  [attr.preserveAspectRatio]="fit() === 'cover' ? 'xMidYMid slice' : 'xMidYMid meet'"
>
  <rect width="300" height="150" fill="var(--bg-2)" />
  @switch (drawing()) {
    @case ('cad') {
      <defs>
        <pattern id="cad-grid" width="14" height="14" patternUnits="userSpaceOnUse">
          <path d="M14 0H0V14" fill="none" stroke="var(--line-2)" stroke-width=".5" />
        </pattern>
      </defs>
      <rect width="300" height="150" fill="url(#cad-grid)" />
      <rect
        x="60"
        y="35"
        width="110"
        height="70"
        fill="none"
        stroke="var(--cyan)"
        stroke-width="1.5"
      />
      <circle cx="200" cy="70" r="32" fill="none" stroke="var(--violet)" stroke-width="1.5" />
      <path d="M60 105 L200 70" stroke="var(--pink)" stroke-dasharray="4 3" />
      @for (c of corners; track $index) {
        <rect [attr.x]="c[0] - 3" [attr.y]="c[1] - 3" width="6" height="6" fill="var(--cyan)" />
      }
    }
    @case ('pdf') {
      @for (i of pages; track i) {
        <g [attr.transform]="'translate(' + (40 + i * 80) + ',' + (18 + i * 6) + ')'">
          <rect width="66" height="100" rx="3" fill="var(--panel-solid)" stroke="var(--line-2)" />
          @for (j of lines; track j) {
            <rect
              x="8"
              [attr.y]="14 + j * 11"
              [attr.width]="50 - (j % 3) * 10"
              height="4"
              rx="2"
              [attr.fill]="j === 2 && i === 1 ? 'var(--amber)' : 'var(--line-2)'"
            />
          }
        </g>
      }
    }
    @case ('table') {
      @for (r of rows; track r) {
        @for (c of cols; track c) {
          <rect
            [attr.x]="20 + c * 54"
            [attr.y]="14 + r * 16"
            width="50"
            height="12"
            rx="2"
            [attr.fill]="r === 0 ? 'var(--violet)' : r === 3 ? 'var(--cyan)' : 'var(--line-2)'"
            [attr.opacity]="r === 0 ? 0.8 : r === 3 ? 0.45 : 0.6"
          />
        }
      }
    }
    @case ('rag') {
      @for (d of dots; track $index) {
        <line [attr.x1]="d.x" [attr.y1]="d.y" x2="150" y2="75" stroke="var(--line-2)" />
        <circle [attr.cx]="d.x" [attr.cy]="d.y" [attr.r]="d.r" [attr.fill]="d.color" />
      }
      <circle cx="150" cy="75" r="12" fill="var(--pink)" />
    }
    @case ('voice') {
      @for (b of bars; track $index) {
        <rect
          [attr.x]="b.x"
          [attr.y]="b.y"
          width="3"
          [attr.height]="b.h"
          rx="1.5"
          [attr.fill]="b.color"
        />
      }
    }
    @default {
      @for (e of endpoints; track $index) {
        <line
          x1="150"
          y1="75"
          [attr.x2]="e[0]"
          [attr.y2]="e[1]"
          stroke="var(--cyan)"
          stroke-dasharray="3 3"
        />
        <rect
          [attr.x]="e[0] - 18"
          [attr.y]="e[1] - 8"
          width="36"
          height="16"
          rx="4"
          fill="var(--panel-solid)"
          stroke="var(--line-2)"
        />
      }
      <circle cx="150" cy="75" r="20" fill="var(--bg-2)" stroke="var(--violet)" stroke-width="2" />
      <text
        x="150"
        y="79"
        text-anchor="middle"
        fill="var(--violet)"
        font-family="monospace"
        font-size="10"
      >
        API
      </text>
    }
  }
</svg>
