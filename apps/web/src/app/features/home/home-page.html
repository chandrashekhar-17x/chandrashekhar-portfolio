<!-- First screen: hero + stats exactly fill the viewport under the nav. -->
<div class="first-screen">
  @if (profile(); as p) {
    <app-hero-section [profile]="p" />
    <app-stats-strip [profile]="p" [skillCount]="skills().length" />
  }
</div>

<!--
  Lazy sections: the server sends same-size skeletons; each section's code downloads
  when it scrolls into view (@defer on viewport), then RevealQueue shows them one at a time.
-->
<section id="graph" class="section" aria-label="Knowledge graph">
  @defer (on viewport) {
    <app-graph-section />
  } @placeholder {
    <app-section-skeleton kind="graph" label="knowledge graph" />
  } @loading (after 100ms; minimum 400ms) {
    <app-section-skeleton kind="graph" label="knowledge graph" [loading]="true" />
  }
</section>

<section id="work" class="section section--work" aria-label="Selected work">
  @defer (on viewport) {
    <app-work-section />
  } @placeholder {
    <app-section-skeleton kind="work" label="selected work" [count]="featuredCount()" />
  } @loading (after 100ms; minimum 400ms) {
    <app-section-skeleton
      kind="work"
      label="selected work"
      [count]="featuredCount()"
      [loading]="true"
    />
  }
</section>
