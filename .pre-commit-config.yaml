# Git hooks: run automatically on `git commit` (installed by `make setup`).
# Run on everything manually:  uv tool run pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  # Basic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=600']
      - id: no-commit-to-branch # work on branches, merge via PR
        args: ['--branch', 'main']

  # Secret scanning: blocks commits that contain API keys or tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Tools from our own environments (same versions as CI)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy apps/api apps/worker apps/mcp scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [ts, javascript, html, scss, css, json, yaml, markdown]

      - id: eslint
        name: eslint (web)
        entry: pnpm --filter @portfolio/web lint
        language: system
        files: ^apps/web/.*\.(ts|html)$
        pass_filenames: false

      - id: content-check
        name: validate content/
        entry: uv run python scripts/validate_content.py
        language: system
        files: ^content/
        pass_filenames: false
